<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>obscura install film</title>
<style>
*{box-sizing:border-box;margin:0}
html,body{width:1280px;height:720px;overflow:hidden;background:#0a0a0b}
body{font:400 16px 'Instrument Sans',system-ui,sans-serif;color:#ededed}
#stage{position:relative;width:1280px;height:720px;background:#0a0a0b;overflow:hidden}
.scene{position:absolute;inset:0;opacity:0;visibility:hidden;will-change:transform,opacity}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}

/* progress dots */
#dots{position:absolute;left:50%;top:22px;transform:translateX(-50%);display:flex;gap:8px;z-index:60;opacity:0}
#dots i{display:block;height:8px;width:8px;border-radius:4px;background:rgba(237,237,237,.22)}
#dots i.on{background:#ededed}

/* captions */
#cap{position:absolute;left:50%;bottom:34px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:10px;z-index:50;width:1100px}
#cap .main{display:flex;align-items:center;gap:12px;background:#ededed;color:#0a0a0b;font:600 21px 'Instrument Sans',sans-serif;padding:8px 24px 8px 8px;border-radius:999px;white-space:nowrap}
#cap .num{width:34px;height:34px;border-radius:50%;background:#0a0a0b;color:#ededed;display:grid;place-items:center;font:600 17px 'JetBrains Mono',monospace}
#cap .sub{font:500 16px 'Instrument Sans',sans-serif;color:#cfcfd2;background:rgba(10,10,11,.86);padding:7px 18px;border-radius:999px;min-height:34px;white-space:nowrap;border:1px solid rgba(255,255,255,.08)}

/* windows */
.win{position:absolute;background:#141416;border:1px solid #2a2a2c;border-radius:14px;overflow:hidden;box-shadow:0 40px 90px rgba(0,0,0,.6)}
.bar{height:38px;background:#1b1b1d;border-bottom:1px solid #2a2a2c;display:flex;align-items:center;padding:0 14px;color:#8c8c8c;font:500 13px 'Instrument Sans',sans-serif;gap:10px}

/* title / end */
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center}
.center h1{font:italic 400 88px/1 'Instrument Serif',serif;letter-spacing:-.02em;display:flex;gap:.26em}
.center h1 span{display:inline-block;will-change:transform,opacity}
.center p{font:400 22px 'Instrument Sans',sans-serif;color:#a3a3a3}
.center code{font:500 20px 'JetBrains Mono',monospace;color:#ededed;background:#141416;border:1px solid #2a2a2c;border-radius:12px;padding:10px 18px}

/* real clip + camera */
#sA{background:#0a0a0b}
#cam{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;will-change:transform}
#cam img{position:absolute;left:0;top:0;width:1280px;height:720px}
#hl{position:absolute;inset:0;pointer-events:none}
.ring{position:absolute;border-radius:50%;border:3px solid rgba(255,255,255,.85);opacity:0}
.box{position:absolute;border-radius:10px;border:2px solid #f08a82;box-shadow:0 0 0 4px rgba(240,138,130,.18);opacity:0}

/* terminal */
#term{left:190px;top:58px;width:900px;height:520px;transform-origin:50% 50%}
#term .ln{position:absolute;left:28px;white-space:pre;font:15px 'JetBrains Mono',monospace;color:#a3a3a3;will-change:transform,opacity}
.cur{display:inline-block;width:9px;height:18px;background:#ededed;vertical-align:-3px}

/* editor */
.ed{left:130px;top:44px;width:1020px;height:540px;transform-origin:50% 50%}
.tabs{display:flex;background:#1b1b1d;height:38px;border-bottom:1px solid #2a2a2c;align-items:flex-end;position:relative}
.tab{padding:0 20px;height:38px;display:flex;align-items:center;gap:8px;font:500 13px 'JetBrains Mono',monospace;color:#6e6e6e;border-right:1px solid #2a2a2c}
.tab.on{background:#141416;color:#ededed}
.sv{font-size:11px;margin-left:6px;display:inline-block}
.code{position:absolute;top:50px;left:0;right:0;bottom:0;font:15px/27px 'JetBrains Mono',monospace;color:#cfcfcf}
.cl{position:absolute;left:0;right:0;height:27px;white-space:pre;padding-left:74px}
.cl i{position:absolute;left:0;width:52px;text-align:right;color:#4a4a4e;font-style:normal}
.cl .k{color:#a8a8a8}.cl .s{color:#e5bc8d}.cl .c{color:#6e6e6e}
.toast{position:absolute;right:26px;top:56px;background:#1d1d20;border:1px solid #38383c;border-radius:12px;padding:12px 18px;font:500 14px 'Instrument Sans',sans-serif;color:#ededed;display:flex;gap:10px;align-items:center}
.toast i{width:9px;height:9px;border-radius:50%;background:#9dd6a4;display:block}

/* result */
#sE{background:#a9ada1}
.barstrip{position:absolute;left:50%;top:150px;transform:translateX(-50%) scale(1.7);transform-origin:center top;display:flex;gap:8px;align-items:center}
.gp{height:48px;border-radius:14px;background:rgba(14,14,14,.75);border:1px solid rgba(234,234,234,.08);display:flex;align-items:center;gap:8px;padding:0 14px;color:#eaeaea;font:600 14px 'Instrument Sans',sans-serif;opacity:.6}
.gp.r{width:48px;padding:0;justify-content:center}
.gp b{background:#262626;border-radius:9px;padding:1px 7px;font-size:11px;font-weight:500}
.op{position:relative;height:48px;border-radius:14px;overflow:hidden;background:rgba(14,14,14,.82);border:1px solid rgba(234,234,234,.1);color:#eaeaea}
.op .lay{position:absolute;inset:0;display:flex;align-items:center;gap:10px;padding-left:14px;white-space:nowrap;font:600 14px 'Instrument Sans',sans-serif}
.ring2{width:18px;height:18px;border-radius:50%;border:1.6px solid #8c8c8c;display:grid;place-items:center}
.ring2 i{width:6px;height:6px;border-radius:50%;background:#8c8c8c}
.rd{width:9px;height:9px;border-radius:50%;background:#f08a82;flex:none}
.clk{font:400 18px 'JetBrains Mono',monospace;min-width:52px}
.stop{margin-left:auto;margin-right:8px;width:30px;height:30px;border-radius:9px;background:#262626;display:grid;place-items:center}
.stop i{width:10px;height:10px;border-radius:2px;background:#eaeaea}
.keys{position:absolute;left:50%;top:400px;transform:translateX(-50%);display:flex;gap:14px;align-items:center}
.key{min-width:92px;height:76px;border-radius:16px;background:#ededed;color:#0a0a0b;border-bottom:7px solid #b9b9b9;display:grid;place-items:center;font:600 24px 'Instrument Sans',sans-serif;padding:0 18px}
.plus{font:600 26px 'Instrument Sans';color:#3b3d37}
.saved{color:#9dd6a4;font-weight:700}
.notif{position:absolute;right:36px;top:34px;width:400px;background:rgba(20,20,22,.96);border:1px solid #2e2e31;border-radius:18px;padding:16px 18px;display:flex;gap:14px;align-items:center;box-shadow:0 20px 50px rgba(0,0,0,.35);color:#ededed}
.notif .ic{width:42px;height:42px;border-radius:12px;background:#0e0e0e;display:grid;place-items:center;flex:none}
.notif b{display:block;font:600 15px 'Instrument Sans',sans-serif}
.notif span{display:block;font:12.5px 'JetBrains Mono',monospace;color:#a3a3a3;margin-top:3px}
</style>
</head>
<body>
<div id="stage">

<div id="dots"><i></i><i></i><i></i><i></i><i></i></div>

<!-- 0 title -->
<div id="s0" class="scene center">
  <svg id="logo" width="132" height="132" viewBox="0 0 100 100" fill="none">
    <circle id="lc" cx="50" cy="50" r="38" stroke="#ededed" stroke-width="5" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>
    <polygon id="lh" points="50,34 63.9,42 63.9,58 50,66 36.1,58 36.1,42" stroke="#ededed" stroke-width="5" stroke-linejoin="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>
    <path id="lb" d="M50 12v22M83 31l-19 11M83 69 64 58M50 88V66M17 69l19-11M17 31l19 11" stroke="#ededed" stroke-width="3.5" stroke-linecap="round" opacity="0"/>
    <circle id="ld" cx="50" cy="50" r="5" fill="#f08a82" style="transform-origin:50px 50px;transform:scale(0)"/>
  </svg>
  <h1 id="t0a"></h1>
  <p id="t0b"></p>
</div>

<!-- A real OBS footage -->
<div id="sA" class="scene">
  <div id="cam"><img id="obsimg" alt=""><div id="hl"></div></div>
</div>

<!-- B terminal -->
<div id="sB" class="scene">
  <div id="term" class="win"><div class="bar"><span class="mono" style="font-size:12px">~/projects</span></div><div id="tlines"></div></div>
</div>

<!-- C editor: quickshell -->
<div id="sC" class="scene">
  <div class="win ed" id="edC">
    <div class="tabs"><div class="tab on" id="tabTop">TopBar.qml<span class="sv" id="svTop"></span></div><div class="tab" id="tabShell">Shell.qml<span class="sv" id="svShell"></span></div></div>
    <div class="code" id="codeC"></div>
  </div>
</div>

<!-- D editor: hyprland -->
<div id="sD" class="scene">
  <div class="win ed" id="edD">
    <div class="tabs"><div class="tab on">hyprland.conf<span class="sv" id="svHypr"></span></div></div>
    <div class="code" id="codeD"></div>
    <div class="toast" id="toastD" style="opacity:0"><i></i><span id="toastTxt"></span></div>
  </div>
</div>

<!-- E result -->
<div id="sE" class="scene">
  <div class="barstrip">
    <div class="op" id="op" style="width:48px">
      <div class="lay" id="lIdle" style="justify-content:center;padding-left:0"><span class="ring2"><i></i></span></div>
      <div class="lay" id="lRec" style="opacity:0"><span class="rd" id="rdot"></span><span class="clk" id="clk">00:00</span><span class="stop"><i></i></span></div>
      <div class="lay" id="lSaved" style="opacity:0"><span class="saved">✓</span><span id="savedTxt"></span></div>
    </div>
    <div class="gp">Meet<b>2</b></div><div class="gp r"><i style="width:16px;height:16px;border-radius:50%;background:#9dd6a4;display:block"></i></div>
  </div>
  <div class="keys" id="keys"><div class="key" id="k1">Super</div><span class="plus">+</span><div class="key" id="k2">Alt</div><span class="plus">+</span><div class="key" id="k3">R</div></div>
  <div class="notif" id="notif" style="opacity:0">
    <div class="ic"><svg width="26" height="26" viewBox="0 0 100 100" fill="none"><circle cx="50" cy="50" r="38" stroke="#ededed" stroke-width="7"/><polygon points="50,34 63.9,42 63.9,58 50,66 36.1,58 36.1,42" stroke="#ededed" stroke-width="7" stroke-linejoin="round"/><circle cx="50" cy="50" r="7" fill="#f08a82"/></svg></div>
    <div><b id="nTitle"></b><span>2026-10-09 22-20-14.mkv</span></div>
  </div>
</div>

<!-- Z end -->
<div id="sZ" class="scene center">
  <svg width="96" height="96" viewBox="0 0 100 100" fill="none"><circle cx="50" cy="50" r="38" stroke="#ededed" stroke-width="5"/><polygon points="50,34 63.9,42 63.9,58 50,66 36.1,58 36.1,42" stroke="#ededed" stroke-width="5" stroke-linejoin="round"/><path d="M50 12v22M83 31l-19 11M83 69 64 58M50 88V66M17 69l19-11M17 31l19 11" stroke="#ededed" stroke-width="3.5" stroke-linecap="round" opacity=".6"/><circle cx="50" cy="50" r="5" fill="#f08a82"/></svg>
  <h1 id="tZa"></h1>
  <p id="tZb"></p>
  <code>github.com/lunanoir21/obscura</code>
</div>

<div id="cap"><div class="main"><span class="num" id="capNum"></span><span id="capMain"></span></div><div class="sub" id="capSub"></div></div>
</div>

<script>
const LANG = new URLSearchParams(location.search).get('lang') === 'tr' ? 'tr' : 'en';
const L = {
  en: {
    t0a: ['Install', 'obscura'], t0b: 'Five steps, about five minutes.',
    c: ['Turn on OBS’s WebSocket server', 'Build it and check the connection', 'Put the pill in your bar', 'Bind a key', 'Record from anywhere'],
    a1: 'OBS → Tools → WebSocket Server Settings', a2: 'Tick “Enable WebSocket server”. Port 4455 stays.', a3: 'OBS wants a password to exist first: Generate Password.', a4: 'Now untick “Enable Authentication”: obscura needs none.', a5: 'OK. That’s all OBS needs.',
    b1: 'Clone and build with cargo', b2: 'Put it on your PATH', b3: 'doctor: “connection ok” means obscura can reach OBS',
    cc1: 'Your Quickshell config: import the module, add the pill', cc2: 'Once in Shell.qml, for the screen-share picker (optional)',
    d1: 'Your Hyprland config (hyprland.conf)', d2: 'Saved. Hyprland picks it up on its own.',
    e1: 'Press the shortcut: the pill opens and the dot lights', e2: 'Press it again: saved, and a notification. Works with the bar hidden too.',
    saved: 'Saved', savedTab: 'saved', toast: 'Hyprland reloaded your config', nt: 'Recording saved', tz1: ['That’s', 'it.'], tz2: 'The pill is in your bar. OBS does the rest.',
    clipOffset: 0.45
  },
  tr: {
    t0a: ['obscura', 'kurulumu'], t0b: 'Beş adım, yaklaşık beş dakika.',
    c: ['OBS’in WebSocket sunucusunu aç', 'Derle ve bağlantıyı denetle', 'Hapı çubuğuna yerleştir', 'Bir tuşa bağla', 'Her yerden kaydet'],
    a1: 'OBS → Araçlar → WebSocket Suncusu Ayarları', a2: '“WebSocket sunucuyu etkinleştir”i işaretle. Port 4455 kalsın.', a3: 'OBS önce bir parola ister: Parola oluştur.', a4: 'Şimdi “Kimlik Doğrulamasını Etkinleştir”i kapat: obscura’nın parolaya ihtiyacı kalmaz.', a5: 'Tamam. OBS tarafı bu kadar.',
    b1: 'cargo ile klonla ve derle', b2: 'PATH’ine koy', b3: 'doctor: “connection ok”, obscura’nın OBS’e ulaştığı demek',
    cc1: 'Quickshell yapılandırman: modülü içe aktar, hapı ekle', cc2: 'Shell.qml’de bir kez, ekran paylaşımı seçici için (isteğe bağlı)',
    d1: 'Hyprland yapılandırman (hyprland.conf)', d2: 'Kaydedildi. Hyprland kendiliğinden yükler.',
    e1: 'Kısayola bas: hap açılır, nokta yanar', e2: 'Tekrar bas: kaydedildi ve bildirim gelir. Çubuk gizliyken de çalışır.',
    saved: 'Kaydedildi', savedTab: 'kaydedildi', toast: 'Hyprland yapılandırmayı yeniden yükledi', nt: 'Kayıt kaydedildi', tz1: ['Hepsi', 'bu.'], tz2: 'Hap çubuğunda. Gerisini OBS yapar.',
    clipOffset: 0.55
  }
}[LANG];
document.documentElement.lang = LANG;

const $ = (s, r = document) => r.querySelector(s);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = x => (x = clamp(x), x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const easeOut = x => 1 - Math.pow(1 - clamp(x), 3);
const back = x => { x = clamp(x); const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const lerp = (a, b, k) => a + (b - a) * k;
const typed = (s, lt, t0, cps) => s.slice(0, Math.max(0, Math.min(s.length, Math.floor((lt - t0) * cps))));
const twoD = n => String(n).padStart(2, '0');
const fmt = s => twoD(Math.floor(s / 60)) + ':' + twoD(Math.floor(s) % 60);
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
const win = (t, a, b) => clamp((t - a) / (b - a));

/* ---- timeline ---- */
const LEN = { s0: 4.2, sA: 24.2, sB: 15.0, sC: 13.6, sD: 9.4, sE: 10.4, sZ: 5.2 };
let acc = 0;
const SC = Object.entries(LEN).map(([id, l]) => { const a = acc; acc += l; return [id, a, acc]; });
const DUR = acc;
const rel = (id, a, b, text) => [SC.find(r => r[0] === id)[1] + a, SC.find(r => r[0] === id)[1] + b, text];
const STEP = { sA: 1, sB: 2, sC: 3, sD: 4, sE: 5 };

/* script times of the recorded clip (clips/obs-<lang>-events.json); scene time == script time */
const EV = LANG === 'tr'
  ? { tools: 3.236, ws: 6.607, enable: 11.03, gen: 14.933, auth: 18.483, ok: 22.34 }
  : { tools: 3.193, ws: 6.447, enable: 10.414, gen: 14.085, auth: 17.675, ok: 21.574 };
const FRAMES = new URLSearchParams(location.search).get('frames') || '';
const CLIP_OFFSET = L.clipOffset;
const CLIP_FPS = 60;

const SUBS = [
  rel('sA', 0.8, EV.ws - 0.1, L.a1), rel('sA', EV.ws + 0.9, EV.enable + 1.2, L.a2), rel('sA', EV.gen - 1.3, EV.gen + 1.5, L.a3), rel('sA', EV.auth - 1.3, EV.auth + 1.6, L.a4), rel('sA', EV.ok - 1.0, LEN.sA - 0.5, L.a5),
  rel('sB', 0.6, 6.6, L.b1), rel('sB', 6.8, 10.0, L.b2), rel('sB', 10.6, 14.6, L.b3),
  rel('sC', 0.6, 7.2, L.cc1), rel('sC', 7.8, 13.2, L.cc2),
  rel('sD', 0.4, 5.2, L.d1), rel('sD', 6.0, 9.0, L.d2),
  rel('sE', 0.8, 5.4, L.e1), rel('sE', 5.6, 10.0, L.e2)
];

/* ---- scene 0 / Z ---- */
function words(el, parts, lt, t0) {
  if (!el.dataset.built) { el.innerHTML = parts.map(w => '<span>' + esc(w) + '</span>').join(''); el.dataset.built = '1'; }
  [...el.children].forEach((sp, i) => { const k = easeOut((lt - t0 - i * 0.14) / 0.7); sp.style.opacity = k; sp.style.transform = 'translateY(' + ((1 - k) * 26) + 'px)'; });
}
function scene0(lt) {
  $('#lc').style.strokeDashoffset = 1 - easeOut(lt / 1.2);
  $('#lh').style.strokeDashoffset = 1 - easeOut((lt - 0.25) / 1.1);
  $('#lb').style.opacity = 0.6 * easeOut((lt - 0.8) / 0.6);
  $('#ld').style.transform = 'scale(' + back((lt - 1.1) / 0.6) + ')';
  words($('#t0a'), L.t0a, lt, 0.9);
  const k = easeOut((lt - 1.6) / 0.7); $('#t0b').style.opacity = k; $('#t0b').style.transform = 'translateY(' + ((1 - k) * 14) + 'px)';
}
function sceneZ(lt) {
  words($('#tZa'), L.tz1, lt, 0.2);
  [['#tZb', 0.9], ['#sZ code', 1.3]].forEach(([s, t0]) => { const k = easeOut((lt - t0) / 0.7); $(s).style.opacity = k; $(s).style.transform = 'translateY(' + ((1 - k) * 14) + 'px)'; });
}

/* ---- scene A: real OBS footage with a moving camera ---- */
const P = LANG === 'tr' ? { tools: [417, 12], item: [483, 169] } : { tools: [326, 12], item: [387, 169] };
/* [t, scale, cx, cy]: (cx, cy) is the point of the clip (1280x720 space) at the middle of the view */
const CAM = [
  [0, 1.0, 640, 360],
  [EV.tools - 1.1, 1.0, 640, 360],
  [EV.tools - 0.2, 1.3, 400, 140],
  [EV.ws + 0.2, 1.3, 440, 170],
  [EV.ws + 1.5, 1.08, 660, 380],
  [EV.enable - 1.2, 1.08, 660, 380],
  [EV.enable - 0.1, 1.28, 600, 200],
  [EV.gen - 1.2, 1.28, 640, 250],
  [EV.gen - 0.1, 1.28, 760, 300],
  [EV.auth - 1.2, 1.28, 700, 320],
  [EV.auth - 0.1, 1.28, 620, 290],
  [EV.ok - 1.4, 1.2, 680, 480],
  [EV.ok - 0.1, 1.28, 710, 560],
  [EV.ok + 1.0, 1.0, 640, 360]
];
function camAt(t) {
  let a = CAM[0], b = CAM[CAM.length - 1];
  for (let i = 0; i < CAM.length - 1; i++) if (t >= CAM[i][0] && t <= CAM[i + 1][0]) { a = CAM[i]; b = CAM[i + 1]; break; }
  if (t <= CAM[0][0]) b = a; else if (t >= CAM[CAM.length - 1][0]) a = b;
  const k = a === b ? 1 : ease((t - a[0]) / (b[0] - a[0]));
  return [lerp(a[1], b[1], k), lerp(a[2], b[2], k), lerp(a[3], b[3], k)];
}
/* drawn over the footage, in clip space (css px = recorded px / 1.5) */
const HL = [
  { at: EV.tools, x: P.tools[0], y: P.tools[1], box: [P.tools[0] - 26, 3, 52, 24] },
  { at: EV.ws, x: P.item[0], y: P.item[1], box: [P.item[0] - 130, P.item[1] - 14, 260, 28] },
  { at: EV.enable, x: 501, y: 139, box: [483, 125, 180, 28] },
  { at: EV.gen, x: 857, y: 327, box: [789, 313, 138, 28] },
  { at: EV.auth, x: 501, y: 296, box: [483, 284, 160, 24] },
  { at: EV.ok, x: 725, y: 604, box: [692, 590, 66, 28] }
];
const hlEl = $('#hl');
HL.forEach((h, i) => {
  const r = document.createElement('div'); r.className = 'ring'; r.id = 'rg' + i; hlEl.appendChild(r);
  const b = document.createElement('div'); b.className = 'box'; b.id = 'bx' + i; b.style.cssText = 'left:' + h.box[0] + 'px;top:' + h.box[1] + 'px;width:' + h.box[2] + 'px;height:' + h.box[3] + 'px'; hlEl.appendChild(b);
});
function sceneA(lt) {
  const n = Math.max(1, Math.floor((lt + CLIP_OFFSET) * CLIP_FPS) + 1);
  const src = FRAMES + '/' + String(n).padStart(5, '0') + '.jpg';
  const img = $('#obsimg');
  if (img.dataset.src !== src) { img.dataset.src = src; img.src = src; }
  const [s, cx, cy] = camAt(lt);
  let tx = 640 - s * cx, ty = 360 - s * cy;
  tx = clamp(tx, 1280 - 1280 * s, 0); ty = clamp(ty, 720 - 720 * s, 0);
  $('#cam').style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + s + ')';
  HL.forEach((h, i) => {
    const age = lt - h.at, r = $('#rg' + i), b = $('#bx' + i);
    if (age >= 0 && age < 0.7) { const k = age / 0.7, d = 20 + k * 60; r.style.cssText = 'left:' + (h.x - d / 2) + 'px;top:' + (h.y - d / 2) + 'px;width:' + d + 'px;height:' + d + 'px;opacity:' + (0.9 * (1 - k)); } else r.style.opacity = 0;
    b.style.opacity = (win(lt, h.at - 0.9, h.at - 0.4) * (1 - win(lt, h.at + 0.2, h.at + 0.8))).toFixed(3);
  });
}
window.ready = () => { const img = $('#obsimg'); if (!img.getAttribute('src')) return Promise.resolve(); return img.complete ? Promise.resolve() : new Promise(r => { img.onload = img.onerror = () => r(); }); };

/* ---- terminal ---- */
const TERM = [
  { type: 'c', t: 0.9, text: 'git clone https://github.com/lunanoir21/obscura', cps: 34 },
  { type: 'o', t: 3.0, text: "Cloning into 'obscura'..." },
  { type: 'c', t: 3.9, text: 'cd obscura && cargo build --release', cps: 34 },
  { type: 'o', t: 5.7, text: '   Compiling obscura-core v0.1.0' },
  { type: 'o', t: 6.8, text: '   Compiling obscura v0.1.0' },
  { type: 'o', t: 8.4, text: '    Finished `release` profile [optimized] target(s) in 14.81s' },
  { type: 'c', t: 9.2, text: 'ln -s "$PWD/target/release/obscura" ~/.local/bin/obscura', cps: 60 },
  { type: 'c', t: 10.8, text: 'obscura doctor', cps: 16 },
  { type: 'o', t: 12.0, parts: [['target      ', '#a3a3a3'], ['127.0.0.1:4455', '#ededed']] },
  { type: 'o', t: 12.3, parts: [['password    ', '#a3a3a3'], ['none', '#ededed']] },
  { type: 'o', t: 12.6, parts: [['connection  ', '#a3a3a3'], ['ok', '#9dd6a4']], glow: true },
  { type: 'o', t: 12.9, parts: [['recording   ', '#a3a3a3'], ['false', '#ededed']] }
];
const TL = 26, TOP = 58;
const tlEl = $('#tlines');
TERM.forEach((r, i) => { const d = document.createElement('div'); d.className = 'ln'; d.style.top = (TOP + i * TL) + 'px'; d.id = 'tl' + i; tlEl.appendChild(d); });
const prog = document.createElement('div'); prog.className = 'ln'; prog.id = 'tprog'; prog.style.top = (TOP + 5 * TL) + 'px'; tlEl.appendChild(prog);
const tend = document.createElement('div'); tend.className = 'ln'; tend.id = 'tend'; tend.style.top = (TOP + TERM.length * TL) + 'px'; tlEl.appendChild(tend);
const jitter = i => ((Math.sin(i * 12.9898) * 43758.5453) % 1 + 1) % 1;

/* a typed command: slower after spaces, so it reads like a person */
function typedHuman(full, lt, t0, cps) {
  let t = t0, n = 0;
  for (let i = 0; i < full.length; i++) {
    const ch = full[i];
    t += (1 / cps) * (0.7 + jitter(i) * 0.7) * (ch === ' ' ? 1.5 : 1) + (ch === ' ' && jitter(i + 7) > 0.8 ? 0.06 : 0);
    if (lt >= t) n = i + 1; else break;
  }
  return [full.slice(0, n), t];
}
function termScene(lt) {
  const w = $('#term'), k = easeOut(lt / 0.8);
  w.style.transform = 'scale(' + lerp(0.94, 1, k) + ') translateY(' + ((1 - k) * 18) + 'px)';
  let cursorRow = -1;
  TERM.forEach((r, i) => {
    const el = $('#tl' + i);
    if (lt < r.t) { el.innerHTML = ''; el.style.opacity = 0; return; }
    const slide = easeOut((lt - r.t) / 0.28);
    if (r.type === 'c') {
      const [shown, doneAt] = typedHuman(r.text, lt, r.t, r.cps);
      el.style.opacity = 1; el.style.transform = 'none';
      el.innerHTML = '<span style="color:#6e6e6e">$ </span><span style="color:#ededed">' + esc(shown) + '</span>';
      if (shown.length < r.text.length || lt < doneAt + 0.5) cursorRow = i;
    } else {
      el.style.opacity = slide; el.style.transform = 'translateY(' + ((1 - slide) * 8) + 'px)';
      if (r.parts) {
        const glow = r.glow ? Math.max(0, 1 - (lt - r.t) / 0.9) : 0;
        el.innerHTML = r.parts.map(p => '<span style="color:' + p[1] + (r.glow && p[1] === '#9dd6a4' ? ';text-shadow:0 0 ' + (14 * glow).toFixed(1) + 'px rgba(157,214,164,' + (0.9 * glow).toFixed(2) + ')' : '') + '">' + esc(p[0]) + '</span>').join('');
      } else el.innerHTML = esc(r.text);
    }
  });
  const ps = 5.9, pe = 8.35;       // cargo's progress bar, between the Compiling lines and Finished
  if (lt >= ps && lt < pe) {
    const f = win(lt, ps, pe), cells = 22, filled = Math.floor(f * cells);
    prog.innerHTML = '<span style="color:#6e6e6e">    Building [' + '='.repeat(Math.max(0, filled - 1)) + (filled ? '>' : '') + ' '.repeat(cells - filled) + '] ' + Math.min(2, Math.floor(f * 3)) + '/2</span>';
  } else prog.innerHTML = '';
  tend.innerHTML = lt > 13.3 ? '<span style="color:#6e6e6e">$ </span><span class="cur" style="opacity:' + (Math.floor(lt * 2) % 2 ? 0 : 1) + '"></span>' : '';
  if (cursorRow >= 0) $('#tl' + cursorRow).insertAdjacentHTML('beforeend', '<span class="cur" style="margin-left:1px"></span>');
}

/* ---- editors ---- */
function mkLines(host, n) { const h = $(host); for (let i = 0; i < n; i++) { const d = document.createElement('div'); d.className = 'cl'; d.style.top = (i * 27) + 'px'; h.appendChild(d); } return [...h.children]; }
const CL = mkLines('#codeC', 17), DL = mkLines('#codeD', 17);
const hlz = s => s.replace(/(#.*$)|("[^"]*")|\b(import|bind)\b|([^#"]+?(?=#|"|\b(?:import|bind)\b|$))/g, (m, c, q, k) =>
  c ? '<span class="c">' + esc(c) + '</span>' : q ? '<span class="s">' + esc(q) + '</span>' : k ? '<span class="k">' + k + '</span>' : esc(m));
const TOPF = [
  { n: 1, text: 'import QtQuick' }, { n: 2, text: 'import Quickshell' },
  { n: 3, text: 'import "../vendor/meet/ui" as MeetModule' },
  { n: 4, text: 'import "../vendor/obscura/ui" as ObscuraModule', add: true, t: 1.4, cps: 44 },
  { n: 5, text: '' }, { n: 6, text: 'Row {' }, { n: 7, text: '    id: rightContent' }, { n: 8, text: '    spacing: barWindow.s(4)' }, { n: 9, text: '' },
  { n: 10, text: '    ObscuraModule.ObscuraPill {', add: true, t: 3.8, cps: 40 },
  { n: 11, text: '        pal: mocha', add: true, t: 5.0, cps: 40 },
  { n: 12, text: '        u: barWindow.s(1)', add: true, t: 5.8, cps: 40 },
  { n: 13, text: '    }', add: true, t: 6.6, cps: 40 },
  { n: 14, text: '' }, { n: 15, text: '    MeetModule.MeetPill {' }, { n: 16, text: '        pal: mocha' }, { n: 17, text: '    }' }
];
const SHELLF = [
  { n: 1, text: 'import QtQuick' }, { n: 2, text: 'import Quickshell' },
  { n: 3, text: 'import "vendor/flare/ui" as FlareModule' },
  { n: 4, text: 'import "vendor/obscura/ui" as ObscuraModule', add: true, t: 8.6, cps: 44 },
  { n: 5, text: '' }, { n: 6, text: 'ShellRoot {' }, { n: 7, text: '    Main {}' }, { n: 8, text: '    TopBar {}' },
  { n: 9, text: '    FlareModule.FlareHost {}' },
  { n: 10, text: '    ObscuraModule.ObscuraPickerHost {}', add: true, t: 10.2, cps: 40 },
  { n: 11, text: '}' }
];
const HYPR = [
  { n: 1, text: 'source = ~/.config/hypr/colors.conf' }, { n: 2, text: '' },
  { n: 3, text: 'bind = CTRL SHIFT, S, exec, grimblast --notify copy area' },
  { n: 4, text: 'bind = SUPER, T, exec, kitty' }, { n: 5, text: '' },
  { n: 6, text: '# obscura (OBS recording)', add: true, t: 1.0, cps: 38 },
  { n: 7, text: 'bind = SUPER ALT, R, exec, obscura toggle', add: true, t: 2.4, cps: 38 },
  { n: 8, text: 'bind = SUPER ALT SHIFT, R, exec, obscura pause', add: true, t: 4.2, cps: 38 }
];
function paintCode(lines, rows, lt, savedAt) {
  lines.forEach((el, i) => {
    const r = rows[i];
    if (!r || (r.add && lt < r.t)) { el.innerHTML = ''; el.style.background = 'transparent'; return; }
    const shown = r.add ? typed(r.text, lt, r.t, r.cps) : r.text;
    let bg = 'transparent';
    if (r.add && shown.length > 0) {
      bg = 'rgba(157,214,164,.09)';
      if (lt >= savedAt) bg = 'rgba(157,214,164,' + (0.09 + 0.22 * Math.max(0, 1 - (lt - savedAt) / 0.8)).toFixed(3) + ')';
    }
    el.style.background = bg;
    el.innerHTML = '<i>' + r.n + '</i>' + hlz(shown) + ((r.add && shown.length < r.text.length) ? '<span class="cur" style="height:16px;margin-left:1px"></span>' : '');
  });
}
function pop(el, lt, t0) { el.style.transform = 'scale(' + (lt < t0 ? 1 : lerp(1.5, 1, clamp(back((lt - t0) / 0.5), 0, 1.2))) + ')'; }
function sceneC(lt) {
  const onShell = lt >= 7.4;
  $('#tabTop').classList.toggle('on', !onShell); $('#tabShell').classList.toggle('on', onShell);
  paintCode(CL, onShell ? SHELLF : TOPF, lt, onShell ? 11.8 : 7.0);
  const st = (el, a, b) => { el.textContent = lt >= b ? '✓ ' + L.savedTab : (lt > a ? '●' : ''); el.style.color = lt >= b ? '#9dd6a4' : '#e3cd92'; };
  st($('#svTop'), 1.4, 7.0); st($('#svShell'), 8.6, 11.8);
  pop($('#svTop'), lt, 7.0); pop($('#svShell'), lt, 11.8);
  const k = easeOut(lt / 0.8);
  const zoom = lt < 7.4 ? 1 + 0.07 * ease(win(lt, 1.0, 2.2)) * (1 - ease(win(lt, 6.8, 7.6))) : 1 + 0.07 * ease(win(lt, 8.2, 9.4)) * (1 - ease(win(lt, 12.2, 13.0)));
  const w = $('#edC'); w.style.transformOrigin = '300px 200px';
  w.style.transform = 'scale(' + (lerp(0.95, 1, k) * zoom) + ') translateY(' + ((1 - k) * 16) + 'px)';
}
function sceneD(lt) {
  paintCode(DL, HYPR, lt, 6.0);
  $('#svHypr').textContent = lt >= 6.0 ? '✓ ' + L.savedTab : (lt > 1.0 ? '●' : '');
  $('#svHypr').style.color = lt >= 6.0 ? '#9dd6a4' : '#e3cd92';
  pop($('#svHypr'), lt, 6.0);
  const t = $('#toastD'), tk = easeOut((lt - 6.6) / 0.45) * (1 - win(lt, 8.6, 9.1));
  $('#toastTxt').textContent = L.toast; t.style.opacity = tk; t.style.transform = 'translateY(' + ((1 - tk) * -14) + 'px)';
  const w = $('#edD'), k = easeOut(lt / 0.8);
  w.style.transformOrigin = '300px 260px';
  w.style.transform = 'scale(' + (lerp(0.95, 1, k) * (1 + 0.07 * ease(win(lt, 0.8, 2.0)) * (1 - ease(win(lt, 5.6, 6.4))))) + ') translateY(' + ((1 - k) * 16) + 'px)';
}

/* ---- result ---- */
function sceneE(lt) {
  const press1 = lt >= 1.2 && lt < 1.6, press2 = lt >= 7.4 && lt < 7.8;
  const phase = lt < 1.5 ? 'idle' : lt < 7.6 ? 'rec' : lt < 10.2 ? 'saved' : 'idle';
  const target = phase === 'rec' ? 156 : phase === 'saved' ? 132 : 48;
  const start = lt < 1.5 ? 0 : lt < 7.6 ? 1.5 : lt < 10.2 ? 7.6 : 10.2;
  const prev = phase === 'rec' ? 48 : phase === 'saved' ? 156 : 132;
  $('#op').style.width = lerp(prev, target, easeOut((lt - start) / 0.55)) + 'px';
  const fade = (id, on) => { $(id).style.opacity = on ? 1 : 0; };
  fade('#lIdle', phase === 'idle'); fade('#lRec', phase === 'rec'); fade('#lSaved', phase === 'saved');
  $('#rdot').style.opacity = Math.floor(lt * 1.25) % 2 ? 0.4 : 1;
  $('#clk').textContent = fmt(Math.max(0, lt - 1.8));
  $('#savedTxt').textContent = L.saved;
  ['#k1', '#k2', '#k3'].forEach(s => { const k = $(s), p = press1 || press2; k.style.transform = p ? 'translateY(6px) scale(.98)' : 'none'; k.style.borderBottomWidth = p ? '1px' : '7px'; });
  const nk = easeOut((lt - 8.0) / 0.5) * (1 - win(lt, 9.9, 10.3));
  const n = $('#notif'); $('#nTitle').textContent = L.nt; n.style.opacity = nk; n.style.transform = 'translateX(' + ((1 - nk) * 60) + 'px)';
}

function seek(t) {
  t = Math.min(Math.max(t, 0), DUR - 0.001);
  for (const [id, a, b] of SC) {
    const el = $('#' + id), on = t >= a && t < b;
    el.style.visibility = on ? 'visible' : 'hidden';
    const k = on ? Math.min(easeOut((t - a) / 0.5), easeOut((b - t) / 0.5)) : 0;
    el.style.opacity = (id === 's0' && t < 0.3) ? 1 : k;
    if (id === 's0' || id === 'sE' || id === 'sZ') el.style.transform = on ? 'scale(' + lerp(0.985, 1, k) + ')' : 'none';
    if (on) {
      const lt = t - a;
      if (id === 's0') scene0(lt);
      if (id === 'sA') sceneA(lt);
      if (id === 'sB') termScene(lt);
      if (id === 'sC') sceneC(lt);
      if (id === 'sD') sceneD(lt);
      if (id === 'sE') sceneE(lt);
      if (id === 'sZ') sceneZ(lt);
    }
  }
  const cur = SC.find(r => t >= r[1] && t < r[2]);
  const step = cur ? STEP[cur[0]] || 0 : 0;
  const dots = $('#dots');
  dots.style.opacity = step ? Math.min(easeOut((t - cur[1]) / 0.5), easeOut((cur[2] - t) / 0.4)) : 0;
  [...dots.children].forEach((d, i) => { d.className = i + 1 <= step ? 'on' : ''; d.style.width = (i + 1 === step ? 26 : 8) + 'px'; });
  const capEl = $('#cap');
  if (step) {
    $('#capNum').textContent = step; $('#capMain').textContent = L.c[step - 1];
    const k = Math.min(easeOut((t - cur[1] - 0.15) / 0.55), easeOut((cur[2] - t) / 0.35));
    capEl.style.opacity = k; $('.main', capEl).style.transform = 'translateY(' + ((1 - k) * 16) + 'px)';
  } else capEl.style.opacity = 0;
  const sub = SUBS.find(s => t >= s[0] && t < s[1]);
  const se = $('#capSub');
  se.textContent = sub ? sub[2] : '';
  const sk = sub ? Math.min(easeOut((t - sub[0]) / 0.35), easeOut((sub[1] - t) / 0.3)) : 0;
  se.style.opacity = sk; se.style.transform = 'translateY(' + ((1 - sk) * 8) + 'px)';
}
window.seek = seek; window.DUR = DUR;
seek(0);
